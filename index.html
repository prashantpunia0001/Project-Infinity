<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For Jyoti ❤️</title>

<style>

body{
margin:0;
background:#000;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
overflow:hidden;
font-family:Arial;
}

h1{
color:white;
font-size:35px;
text-align:center;
animation:glow 2s infinite alternate;
}

@keyframes glow{

from{
text-shadow:0 0 10px hotpink;
}

to{
text-shadow:0 0 40px red;
}

}
.container{
  text-align:center;
}

p{
  color:white;
  font-size:20px;
  margin:20px;
}

button{
  padding:15px 30px;
  font-size:20px;
  background:#ff2d75;
  color:white;
  border:none;
  border-radius:30px;
  cursor:pointer;
}
</style>

</head>

<body>

<div class="container">

  <div class="heart">❤️</div>

  <h1>Welcome Jyoti ❤️</h1>

  <p>
    You didn't just scan a QR Code...
    <br><br>
    You unlocked a piece of Prashant's Heart ❤️
  </p>

  <button>Unlock My Heart</button>

</div>
<script>
document.querySelector("button").onclick = function() {
  alert("❤️ Welcome Jyoti ❤️\n\nYou unlocked Prashant's Heart!");
};
</script>
</body>

</html>
