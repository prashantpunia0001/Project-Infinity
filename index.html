<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For Jyoti ❤️</title>

<style>

body{
margin:0;
background:#000;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
overflow:hidden;
font-family:Arial;
}

h1{
color:white;
font-size:35px;
text-align:center;
animation:glow 2s infinite alternate;
}

@keyframes glow{

from{
text-shadow:0 0 10px hotpink;
}

to{
text-shadow:0 0 40px red;
}

}
.container{
  text-align:center;
}

p{
  color:white;
  font-size:20px;
  margin:20px;
}

button{
  padding:15px 30px;
  font-size:20px;
  background:#ff2d75;
  color:white;
  border:none;
  border-radius:30px;
  cursor:pointer;
}
  .gallery{
display:none;
flex-wrap:wrap;
justify-content:center;
gap:15px;
padding:20px;
margin-top:20px;
overflow-y:auto;
height:100vh;
}

.gallery img{
width:180px;
border-radius:15px;
box-shadow:0 0 15px hotpink;
animation:fade 1s;
}

@keyframes fade{
from{
opacity:0;
transform:scale(.8);
}
to{
opacity:1;
transform:scale(1);
}
}
</style>

</head>

<body>

<div class="container">

  <div class="heart">❤️</div>

  <h1>Welcome Jyoti ❤️</h1>

  <p>
    You didn't just scan a QR Code...
    <br><br>
    You unlocked a piece of Prashant's Heart ❤️
  </p>

  <button>Unlock My Heart</button>
<div class="gallery" id="gallery">

<img src="assets/photos/jyoti1.jpg">
<img src="assets/photos/jyoti2.jpg">
<img src="assets/photos/jyoti3.jpg">
<img src="assets/photos/jyoti5.jpg">
<img src="assets/photos/jyoti6.jpg">
<img src="assets/photos/jyoti7.jpg">
<img src="assets/photos/jyoti8.jpg">
<img src="assets/photos/jyoti9.jpg">
<img src="assets/photos/jyoti10.jpg">

<img src="assets/photos/me1.jpg">
<img src="assets/photos/me2.jpg">
<img src="assets/photos/me3.jpg">
<img src="assets/photos/me4.jpg">
<img src="assets/photos/me5.jpg">
<img src="assets/photos/me6.jpg">
<img src="assets/photos/me8.jpg">
<img src="assets/photos/me9.jpg">

<img src="assets/photos/together1.jpg">
<img src="assets/photos/together2.jpg">
<img src="assets/photos/together3.jpg">
<img src="assets/photos/together4.jpg">
<img src="assets/photos/together5.jpg">
<img src="assets/photos/together6.jpg">
<img src="assets/photos/together7.jpg">
<img src="assets/photos/together8.jpg">
<img src="assets/photos/together9.jpg">

</div>
</div>
<script>

document.querySelector("button").onclick=function(){

document.querySelector(".heart").style.display="none";
document.querySelector("h1").style.display="none";
document.querySelector("p").style.display="none";
document.querySelector("button").style.display="none";

document.getElementById("gallery").style.display="flex";

}

</script>
</body>

</html>
